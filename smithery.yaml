# Smithery configuration for Segfy
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_segfy

name: segfy-mcp
displayName: "Segfy"
description: >
  Segfy, plataforma de multicálculo e gestão para corretoras de seguros. Conecte a sua conta com o e-mail e a senha do seu login do Segfy para trazer a sua corretora para o assistente.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/segfy-mcp
repository: https://github.com/mcp-dir/segfy-mcp

tags:
  - segfy
  - brazil
  - sales
  - vertical
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_segfy

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_segfy/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
